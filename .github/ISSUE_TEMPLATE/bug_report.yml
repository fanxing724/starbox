name: 问题反馈
description: 解析失败 / 下载不动 / 速度异常等。请务必附上运行日志。
title: "[问题] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        **感谢反馈！请尽量附日志** —— 没有日志的「下不了」「很慢」很难定位。

        取日志方法：
        1. 打开 **设置 → 排查 → 运行日志**
        2. 点 **清空**，然后**复现一次问题**
        3. 点 **复制**（或 **导出** 到系统 Download）
        4. 粘贴到下面的日志框

        日志已脱敏：Cookie / Token / 签名参数一律打码，可放心公开粘贴。

  - type: dropdown
    id: drive
    attributes:
      label: 涉及的网盘
      options:
        - UC 网盘
        - 夸克网盘
        - 阿里云盘
        - 百度网盘
        - 迅雷网盘
        - 123 云盘
        - 蓝奏云
        - 光鸭云盘
        - 移动云盘 139
        - 115 网盘
        - 城通网盘
        - PikPak
        - 天翼云盘
        - 腾讯微云
        - 与网盘无关（界面/下载引擎/其他）
    validations:
      required: true

  - type: dropdown
    id: stage
    attributes:
      label: 卡在哪一步
      options:
        - 链接识别不出来
        - 解析列表失败
        - 转存失败
        - 取直链失败
        - 能开始下载但不动 / 报错
        - 速度异常慢
        - 下载完成但文件损坏 / 找不到
        - 登录页有问题
        - 其他
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: 应用版本
      description: 设置 → 关于 里可以看到，例如 0.9.22
      placeholder: "0.9.22"
    validations:
      required: true

  - type: input
    id: device
    attributes:
      label: 设备与系统版本
      placeholder: "例如 Redmi K60 / Android 14（HyperOS）"
    validations:
      required: true

  - type: textarea
    id: what
    attributes:
      label: 现象描述
      description: 期望什么、实际什么。界面上的报错原文也请贴出来。
      placeholder: |
        点「转存后下载」后提示…，下载管理里进度一直 0%。
    validations:
      required: true

  - type: textarea
    id: log
    attributes:
      label: 运行日志
      description: 设置 → 排查 → 运行日志 → 清空 → 复现 → 复制，粘贴到这里。
      render: text
      placeholder: |
        11-23 22:40:47.701 I/Quark: 快传令牌已取，走快传线路
        11-23 22:40:47.798 I/Quark: 个人盘取链 fid=… → OK
        11-23 22:40:52.839 I/DL: 进度 43% … 速度=6247101B/s
    validations:
      required: true

  - type: input
    id: link
    attributes:
      label: 分享链接（可选）
      description: 便于复现。**请勿填写含私密内容的链接**；有提取码的可一并给出。

  - type: checkboxes
    id: checks
    attributes:
      label: 确认
      options:
        - label: 我已附上运行日志（或说明为何拿不到）
          required: true
        - label: 我理解本应用不破解限速，账号级带宽限制导致的速度问题不属于缺陷
          required: true
